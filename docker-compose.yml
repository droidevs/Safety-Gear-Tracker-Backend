version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: safety_gear_tracker_db
      POSTGRES_USER: safety_user
      POSTGRES_PASSWORD: safety_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP server

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - maildev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/safety_gear_tracker_db
      SPRING_DATASOURCE_USERNAME: safety_user
      SPRING_DATASOURCE_PASSWORD: safety_password
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_KEY: minioadmin
      AWS_S3_BUCKET: alerts
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: your-email@example.com
      SPRING_MAIL_PASSWORD: your-email-password
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST: smtp.gmail.com # Removed as not needed for Maildev
      MASTER_USER_EMAIL: master@droidevs.com
      MASTER_USER_PASSWORD: MasterPassword123
      MASTER_USER_FIRSTNAME: Master
      MASTER_USER_LASTNAME: User
      GEMINI_PROJECT_ID: your-google-cloud-project-id
      GEMINI_LOCATION: us-central1
      GEMINI_MODEL_NAME: gemini-2.5-pro
      APPLICATION_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION: 259200000
      APPLICATION_MAILING_FRONTEND_ACTIVATION_URL: http://localhost:4200/activate-account # Placeholder for frontend URL

volumes:
  postgres_data:
  minio_storage:
