version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: safety_gear_tracker_db
      POSTGRES_USER: safety_user
      POSTGRES_PASSWORD: safety_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP server

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - maildev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/safety_gear_tracker_db
      SPRING_DATASOURCE_USERNAME: safety_user
      SPRING_DATASOURCE_PASSWORD: safety_password
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_KEY: minioadmin
      AWS_S3_BUCKET: alerts
      SPRING_MAIL_HOST: maildev
      SPRING_MAIL_PORT: 1025
      MASTER_USER_EMAIL: master@droidevs.com
      MASTER_USER_PASSWORD: MasterPassword123
      MASTER_USER_FIRSTNAME: Master
      MASTER_USER_LASTNAME: User
      GEMINI_PROJECT_ID: ${GEMINI_PROJECT_ID}
      GEMINI_LOCATION: ${GEMINI_LOCATION}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME}

volumes:
  postgres_data:
  minio_storage:
