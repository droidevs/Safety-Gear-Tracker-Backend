<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Code — Safety Gear Tracker</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⬛ SGT</div>
    <div class="auth-tagline">Weekly access verification</div>
    <h1 class="auth-title">Enter weekly code</h1>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.5;">
      A new 6-digit access code is issued every Monday. Enter yours to maintain system access.
    </p>
    <div id="weekly-error" class="flash flash-error" style="display:none"></div>
    <form id="weekly-code-form">
      <div class="form-group">
        <label class="form-label">Access code</label>
        <input class="form-control" type="text" name="code" maxlength="6" required
               placeholder="000000" inputmode="numeric" style="letter-spacing:0.3em;text-align:center;font-size:22px;"/>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:8px;">Submit code</button>
    </form>
    <div class="auth-footer" style="margin-top:16px;">
      <a href="/ui/login">Back to sign in</a>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
