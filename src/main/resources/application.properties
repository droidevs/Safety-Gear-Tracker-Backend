# Master User Default Credentials
master.user.email=master@example.com
master.user.password=DefaultMasterPassword123

spring.application.name=demo
server.port=${PORT:8080}
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# PostgreSQL Database Configuration
# JDBC URL for the PostgreSQL database

spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.dbname=safety_gear_tracker_db
# Database username
spring.datasource.username=safety_username
# Database password
spring.datasource.password=safety_password
# Database driver class name
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
# Automatically update the database schema (use 'validate' or migration tools for production)
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries executed by Hibernate (useful for debugging)
spring.jpa.show-sql=true
# Specify the dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# S3 Configuration
aws.accessKeyId=minioadmin
aws.secretKey=minioadmin
aws.s3.bucket=alerts
aws.s3.endpoint=http://localhost:9000

# Gemini AI Configuration
gemini.project.id=your-google-cloud-project-id
gemini.location=us-central1
gemini.model.name=gemini-2.5-pro
