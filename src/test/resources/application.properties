# In-memory H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA and Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Minimal auth + master user properties for context initialization
master.user.email=master@example.com
master.user.password=DefaultMasterPassword123
master.user.firstname=Master
master.user.lastname=User
application.mailing.frontend.activation-url=http://localhost:3000/activate-account
application.security.jwt.secret-key=test-secret-key-32chars-minimum
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000
