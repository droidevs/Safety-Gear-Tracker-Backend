# Test-specific properties
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Required properties for tests to load ApplicationContext
application.security.jwt.refresh-token.expiration=86400000
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=password
application.mailing.frontend.activation-url=http://localhost:4200/activate-account
master.user.email=master@example.com
master.user.firstname=Master
master.user.lastname=User
master.user.password=DefaultMasterPassword123

# AWS S3 Configuration for tests
aws.accessKeyId=test-key
aws.secretKey=test-secret
aws.s3.bucket=test-bucket
aws.s3.endpoint=http://localhost:9000
